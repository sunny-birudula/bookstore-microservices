spring.application.name=order-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/mvccrud
spring.datasource.username=root
spring.datasource.password=system
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Downstream services (called directly, not through the gateway)
services.book-service.url=http://localhost:8081
services.user-service.url=http://localhost:8082
